{# Revenue by month for the chosen year. Choosing a year sends it to supplier_monthly_chart, and ActivateYearDropdown (customers.js) replaces #dashboard-monthly with the chart that comes back. A month with no sales shows as $0. #}
<div class="dt-card h-100">
    <nav class="dt-controls">
        <div class="dt-control-group">
            <label for="dashboard-year" class="fw-bold mb-0">Year</label>
            <select id="dashboard-year"
                    class="form-select w-auto"
                    data-url="{% url 'djtraders:supplier_monthly_chart' supplier.supplier_id %}">
                {% for year in order_years %}
                    <option value="{{ year }}"{% if forloop.first %} selected{% endif %}>{{ year }}</option>
                {% endfor %}
            </select>
        </div>
    </nav>
    <div id="dashboard-monthly"></div>
</div>
