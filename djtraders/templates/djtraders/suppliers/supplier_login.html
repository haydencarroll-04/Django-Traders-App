<!--
    Login page for a supplier (djtraders/views.py's supplier_login_view).
    "error" is only set after a failed POST; it's None on the first GET.
    "suppliers" is a Supplier queryset, ordered by company_name, driving
    the Company dropdown below -- same pattern as customer_login.html.
    Every supplier uses the same shared password (Supplier.SHARED_PASSWORD).

    A centered card styled with the Supplier (sage) color scheme --
    dt-btn-primary-supplier for Log In, dt-icon-supplier for the heading
    icon. The Customer Login link below the form is the way back for a
    visitor who is not a supplier.
-->
{% extends "common/base.html" %}

{% block title %}Supplier Login{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card mt-4 border-0 shadow-sm">
                <div class="card-header fw-bolder h5">
                    <i class="fa-solid fa-truck-field dt-icon-supplier"></i>
                    Supplier Login
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger py-2">{{ error }}</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="supplier-select" class="form-label">Company</label>
                            <select name="supplier_id" id="supplier-select" class="form-select" required>
                                <option value="">Select your company</option>
                                {% for supplier in suppliers %}
                                    <option value="{{ supplier.supplier_id }}">{{ supplier.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password-input" class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   id="password-input"
                                   class="form-control"
                                   required>
                        </div>

                        <button type="submit" class="btn dt-btn-primary-supplier w3-hover-shadow w-100" title="Log in">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>
                            Log In
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <div class="dt-link-wrap btn btn-sm dt-btn-secondary-customer w3-hover-shadow">
                            <a href="{% url 'djtraders:customer_login' %}" title="Log in as a customer">
                                <i class="fa-solid fa-user-lock me-1"></i>
                                Customer Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
