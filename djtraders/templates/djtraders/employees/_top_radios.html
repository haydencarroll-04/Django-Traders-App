{# "Show Top" radio buttons (5, 10, All). The including template passes name, which becomes the inputs' name and the prefix of their ids; 10 starts selected. #}
<div class="dt-control-group" role="radiogroup" aria-labelledby="{{ name }}-label">
    <span id="{{ name }}-label" class="fw-bold">Show Top</span>
    <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="radio" name="{{ name }}" id="{{ name }}-5" value="5">
        <label class="form-check-label" for="{{ name }}-5">5</label>
    </div>
    <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="radio" name="{{ name }}" id="{{ name }}-10" value="10" checked>
        <label class="form-check-label" for="{{ name }}-10">10</label>
    </div>
    <div class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="radio" name="{{ name }}" id="{{ name }}-all" value="all">
        <label class="form-check-label" for="{{ name }}-all">All</label>
    </div>
</div>
