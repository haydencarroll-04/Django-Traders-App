<!--
    Partial template: the Add to Cart card on order_build.html. Included
    there for the first page load, and rendered again on its own in two
    cases, each time swapped in for the current card with no page reload:
    order_add_line (djtraders/views.py) sends a fresh, empty card after
    every successful add, and order_add_card sends one narrowed to the
    category just chosen in the dropdown. All three renderers build the
    context with _add_to_cart_context (customer, detail_form, categories,
    search_category_id, product_stock).

    Because a swap replaces this card's elements outright, nothing here
    can carry state of its own: AddOrderLineItem (DjangoTraders.js)
    listens for the form's submit and the dropdown's change from
    document, which is never replaced, and re-attaches the Product
    autocomplete to the new text box after each swap.
-->
<div id="add-to-cart-card" class="card mb-3 border-0 shadow-sm">
    <div class="card-header fw-bolder h5">Add to Cart</div>
    <div class="card-body">
        <!-- #region [CONCEPT] Enhancement 2: category filter re-renders this card -->
        <!-- Not part of any form -- AddOrderLineItem (DjangoTraders.js) listens for
             a change on this dropdown, asks data-card-url (order_add_card,
             djtraders/views.py) for a fresh copy of this whole card rendered for
             the chosen category, and swaps it in. The new card's Product search
             and stock data are both narrowed to that category (data-category on
             the text box and product_stock below), and the dropdown comes back
             already set to it. -->
        <!-- #endregion -->
        <div class="mb-3">
            <label for="id_category_filter" class="form-label">Filter by Category</label>
            <select id="id_category_filter" class="form-select"
                    data-card-url="{% url 'djtraders:order_add_card' customer.customer_id %}">
                <option value="">All Categories</option>
                {% for category in categories %}
                    <option value="{{ category.category_id }}"
                            {% if category.category_id|stringformat:"s" == search_category_id %}selected{% endif %}>{{ category.category_name }}</option>
                {% endfor %}
            </select>
        </div>
        <form id="order-detail-form" method="post" action="{% url 'djtraders:order_add_line' customer.customer_id %}">
            {% csrf_token %}
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="product-search" class="form-label">Product</label>
                    <!-- #region [CONCEPT] Product autocomplete: visible text box + hidden id -->
                    <!-- The text box is autocomplete-only (it is never submitted -- no name
                         attribute); AddOrderLineItem (DjangoTraders.js) points jQuery UI at
                         the search URL in data-search-url. The hidden field rendered next
                         is the real form field, id_product, which carries the chosen
                         product's primary key. -->
                    <!-- #endregion -->
                    <input type="text" id="product-search" class="form-control"
                           placeholder="Start typing a product name..." autocomplete="off"
                           data-search-url="{% url 'djtraders:product_search_json' %}"
                           data-category="{{ search_category_id }}">
                    {{ detail_form.product }}
                    <div id="product-low-stock-note" class="mt-1 d-none">
                        <span class="badge text-bg-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i>Low stock</span>
                        <span class="small text-muted" id="product-low-stock-count"></span>
                    </div>
                </div>
                <div class="col-md-2">
                    <label for="id_quantity" class="form-label">Quantity</label>
                    {{ detail_form.quantity }}
                </div>
                <div class="col-md-3">
                    <label for="id_discount_percent" class="form-label">Discount %</label>
                    {{ detail_form.discount_percent }}
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn dt-btn-primary-customer w3-hover-shadow w-100" title="Add to Cart">
                        <i class="fa-solid fa-cart-plus me-1"></i>Add to Cart
                    </button>
                </div>
            </div>
            <div class="form-text mt-2">
                Order more than 10 of any product and get 10% off those products!
            </div>
            <div id="order-detail-form-error" class="alert alert-danger mt-3 d-none"></div>
        </form>
        <!-- #region [CONCEPT] Enhancement 5: product_stock as JSON, for JS to read -->
        <!-- json_script (a built-in Django template filter) renders product_stock
             (a {product_id: units_in_stock} dict) as a <script type="application/json">
             tag with the given id -- a safe way to hand server-side data to
             JavaScript, since it escapes the value the same way Django auto-escapes
             anywhere else in a template. AddOrderLineItem (DjangoTraders.js) reads
             it back with JSON.parse() for its own courtesy stock check, alongside
             (not instead of) OrderDetailForm's own clean(). -->
        <!-- #endregion -->
        {{ product_stock|json_script:"product-stock-data" }}
    </div>
</div>
