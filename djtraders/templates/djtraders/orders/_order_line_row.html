<!--
    One <tr> for order_build.html's line-items table. It is rendered on the
    page's first load and by order_add_line's AJAX response (views/orders.py), so a
    line looks the same either way. customer_id is passed in alongside line,
    for the Remove button's URL.

    data-product-id on the <tr> is how AddOrderLineItem (orders.js) finds an
    existing row to replace, instead of appending a duplicate. line.discount_percent
    is the stored 0.0-1.0 discount times 100, for display (_cart_lines, views/orders.py).
-->
<tr data-product-id="{{ line.product.product_id }}">
    <td>{{ line.product.product_name }}</td>
    <td class="text-end">${{ line.unit_price|floatformat:2 }}</td>
    <td class="text-end">
        <!-- The Quantity cell is a small form of its own -- a number box and an
             Update button. orders.js's UpdateCartQuantities intercepts its
             submit, POSTs to order_update_line (djtraders/views/ package), and swaps
             this whole row for the one that comes back, so the quantity, discount
             and line total always agree. min=/max= are a courtesy only;
             OrderLineQuantityForm (djtraders/forms.py) is the real check. Without
             JavaScript the form still works as an ordinary POST. -->
        <form method="post"
              action="{% url 'djtraders:order_update_line' customer_id line.product.product_id %}"
              class="order-line-quantity-form d-inline-flex align-items-center justify-content-end gap-1">
            {% csrf_token %}
            <input type="number" name="quantity" value="{{ line.quantity }}"
                   min="1" max="{{ line.product.units_in_stock|default_if_none:0 }}" required
                   class="form-control form-control-sm text-end dt-cart-quantity"
                   aria-label="Quantity of {{ line.product.product_name }}">
            <button type="submit" class="btn btn-sm dt-btn-primary-customer dt-hover-shadow" title="Update quantity">
                <i class="fa-solid fa-check"></i>
            </button>
        </form>
    </td>
    <td class="text-end">
        {{ line.discount_percent|floatformat:"-2" }}%
        {% if line.is_volume_discount %}<span class="badge text-bg-success ms-1" title="Automatic discount for ordering more than 10 units">Volume</span>{% endif %}
    </td>
    <td class="text-end">${{ line.line_total|floatformat:2 }}</td>
    <td class="text-center">
        <!-- Remove is one click with no confirm step, like order_detail.html's Cancel Order button (see order_remove_line in views/orders.py). -->
        <form method="post" action="{% url 'djtraders:order_remove_line' customer_id line.product.product_id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm dt-btn-secondary-customer dt-hover-shadow" title="Remove from cart">
                <i class="fa-solid fa-trash dt-icon-danger"></i>
            </button>
        </form>
    </td>
</tr>
